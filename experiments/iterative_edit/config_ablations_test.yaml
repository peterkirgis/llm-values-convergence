experiment:
  name: iterative_edit_ablations_test
  description: "Cheap test run for baseline plus three prompt ablations"
  n_rounds: 20
  temperature: 0.7
  conditions:
    - condition_id: baseline
      condition_name: Baseline
    - condition_id: you_framing
      condition_name: You Framing
      use_you_framing: true
    - condition_id: allow_no_edit
      condition_name: No-Edit Allowed
      allow_no_edit: true
    - condition_id: implementation_note
      condition_name: Real-World Implementation
      implementation_note: true

openrouter:
  disable_compression: true
  allow_fallbacks: false
  provider_order:
    anthropic: ["anthropic"]
    openai: ["openai"]
    google: ["google-ai-studio", "google-vertex"]
    xai: ["xai"]

assignments:
  - model:
      model_id: "anthropic/claude-haiku-4.5"
      provider: anthropic
      display_name: "Claude Haiku 4.5"
    documents:
      - doc_id: claude_constitution
        name: "Claude's Constitution"
        provider: anthropic
        doc_type: constitution
      - doc_id: opus_system_prompt
        name: "Claude Opus 4.6 System Prompt"
        provider: anthropic
        doc_type: system_prompt

  - model:
      model_id: "openai/gpt-5.4-mini"
      provider: openai
      display_name: "GPT-5.4 Mini"
    documents:
      - doc_id: openai_model_spec
        name: "OpenAI Model Spec"
        provider: openai
        doc_type: constitution
      - doc_id: gpt_system_prompt
        name: "GPT-5.4 System Prompt"
        provider: openai
        doc_type: system_prompt

  - model:
      model_id: "google/gemini-3-flash-preview"
      provider: google
      display_name: "Gemini 3 Flash"
    documents:
      - doc_id: gemini_constitution
        name: "Gemini App Approach"
        provider: google
        doc_type: constitution
      - doc_id: gemini_system_prompt
        name: "Gemini 3.1 Pro System Prompt"
        provider: google
        doc_type: system_prompt

  - model:
      model_id: "x-ai/grok-4.20-beta"
      provider: xai
      display_name: "Grok 4.2"
    documents:
      - doc_id: grok_system_prompt
        name: "Grok 4.2 System Prompt"
        provider: xai
        doc_type: system_prompt

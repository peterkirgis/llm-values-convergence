experiment:
  name: iterative_edit_frontier_cross
  description: "Editor x document matrix for the frontier models (Claude Opus 4.7 adaptive thinking, GPT-5.5 medium reasoning) on the four anchor documents, with no provider system-prompt prepend."
  n_rounds: 20
  temperature: 0.7
  conditions:
    - condition_id: cross_edit
      condition_name: Cross Edit
      description: "Baseline editing without prepending the editor's provider system prompt"
      prepend_system_prompt_for_constitutions: false

openrouter:
  disable_compression: true
  allow_fallbacks: false
  provider_order:
    anthropic: ["anthropic"]
    openai: ["openai"]
    google: ["google-ai-studio", "google-vertex"]
    xai: ["xai"]

assignments:
  - model:
      model_id: "anthropic/claude-opus-4.7"
      provider: anthropic
      display_name: "Claude Opus 4.7"
    documents: &anchor_docs
      - doc_id: claude_constitution
        name: "Claude's Constitution"
        provider: anthropic
        doc_type: constitution
      - doc_id: openai_model_spec
        name: "OpenAI Model Spec"
        provider: openai
        doc_type: constitution
      - doc_id: gemini_system_prompt
        name: "Gemini 3.1 Pro System Prompt"
        provider: google
        doc_type: system_prompt
      - doc_id: grok_system_prompt
        name: "Grok 4.3 System Prompt"
        provider: xai
        doc_type: system_prompt

  - model:
      model_id: "openai/gpt-5.5"
      provider: openai
      display_name: "GPT-5.5"
      reasoning_effort: medium
    documents: *anchor_docs

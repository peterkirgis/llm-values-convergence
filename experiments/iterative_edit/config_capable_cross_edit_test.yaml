experiment:
  name: iterative_edit_capable_cross_test
  description: "Smoke test for the capable-model cross-edit matrix: 3 rounds per chain."
  n_rounds: 3
  temperature: 0.7
  conditions:
    - condition_id: cross_edit
      condition_name: Cross Edit
      prepend_system_prompt_for_constitutions: false

openrouter:
  disable_compression: true
  allow_fallbacks: false
  provider_order:
    anthropic: ["anthropic"]
    openai: ["openai"]
    google: ["google-ai-studio", "google-vertex"]
    xai: ["xai"]

assignments:
  - model:
      model_id: "anthropic/claude-sonnet-4.6"
      provider: anthropic
      display_name: "Claude Sonnet 4.6"
    documents: &anchor_docs
      - doc_id: claude_constitution
        name: "Claude's Constitution"
        provider: anthropic
        doc_type: constitution
      - doc_id: openai_model_spec
        name: "OpenAI Model Spec"
        provider: openai
        doc_type: constitution
      - doc_id: gemini_system_prompt
        name: "Gemini 3.1 Pro System Prompt"
        provider: google
        doc_type: system_prompt
      - doc_id: grok_system_prompt
        name: "Grok 4.3 System Prompt"
        provider: xai
        doc_type: system_prompt

  - model:
      model_id: "openai/gpt-5.4"
      provider: openai
      display_name: "GPT-5.4"
    documents: *anchor_docs

  - model:
      model_id: "google/gemini-3.1-pro-preview"
      provider: google
      display_name: "Gemini 3.1 Pro"
    documents: *anchor_docs

  - model:
      model_id: "x-ai/grok-4.3"
      provider: xai
      display_name: "Grok 4.3"
    documents: *anchor_docs

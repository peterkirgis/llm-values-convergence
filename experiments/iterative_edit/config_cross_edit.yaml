experiment:
  name: iterative_edit_cross
  description: "Editor x document matrix: every editor model revises every anchor document. No provider system prompt is prepended, so the editor is in a neutral stance rather than 'cosplaying' as another provider's model."
  n_rounds: 20
  temperature: 0.7
  conditions:
    - condition_id: cross_edit
      condition_name: Cross Edit
      description: "Baseline editing without prepending the editor's provider system prompt"
      prepend_system_prompt_for_constitutions: false

openrouter:
  disable_compression: true
  allow_fallbacks: false
  provider_order:
    anthropic: ["anthropic"]
    openai: ["openai"]
    google: ["google-ai-studio", "google-vertex"]
    xai: ["xai"]

# Each editor runs against the full anchor set of 4 documents:
#   Claude's Constitution (constitution), OpenAI Model Spec (constitution),
#   Gemini system prompt (system_prompt), Grok system prompt (system_prompt).
# The document list is identical across all four editors, yielding a 4x4 matrix.
assignments:
  - model:
      model_id: "anthropic/claude-haiku-4.5"
      provider: anthropic
      display_name: "Claude Haiku 4.5"
    documents: &anchor_docs
      - doc_id: claude_constitution
        name: "Claude's Constitution"
        provider: anthropic
        doc_type: constitution
      - doc_id: openai_model_spec
        name: "OpenAI Model Spec"
        provider: openai
        doc_type: constitution
      - doc_id: gemini_system_prompt
        name: "Gemini 3 Flash System Prompt"
        provider: google
        doc_type: system_prompt
      - doc_id: grok_system_prompt
        name: "Grok 4.2 System Prompt"
        provider: xai
        doc_type: system_prompt

  - model:
      model_id: "openai/gpt-5.4-mini"
      provider: openai
      display_name: "GPT-5.4 Mini"
    documents: *anchor_docs

  - model:
      model_id: "google/gemini-3-flash-preview"
      provider: google
      display_name: "Gemini 3 Flash"
    documents: *anchor_docs

  - model:
      model_id: "x-ai/grok-4.20-beta"
      provider: xai
      display_name: "Grok 4.2"
    documents: *anchor_docs

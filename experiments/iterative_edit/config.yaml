experiment:
  name: iterative_edit
  description: "Each model iteratively edits its own provider's documents, one change per round"
  n_rounds: 10
  temperature: 0.7

# Each model edits its own provider's documents
assignments:
  - model:
      model_id: "anthropic/claude-opus-4-6"
      provider: anthropic
      display_name: "Claude Opus 4.6"
    documents:
      - doc_id: claude_constitution
        name: "Claude's Constitution"
        provider: anthropic
        doc_type: constitution
      - doc_id: opus_system_prompt
        name: "Claude Opus 4.6 System Prompt"
        provider: anthropic
        doc_type: system_prompt

  - model:
      model_id: "openai/gpt-5-4-thinking"
      provider: openai
      display_name: "GPT-5.4 Thinking"
    documents:
      - doc_id: openai_model_spec
        name: "OpenAI Model Spec"
        provider: openai
        doc_type: constitution
      - doc_id: gpt_system_prompt
        name: "GPT-5.4 System Prompt"
        provider: openai
        doc_type: system_prompt

  - model:
      model_id: "google/gemini-3.1-pro-preview"
      provider: google
      display_name: "Gemini 3.1 Pro"
    documents:
      - doc_id: gemini_constitution
        name: "Gemini App Approach"
        provider: google
        doc_type: constitution
      - doc_id: gemini_system_prompt
        name: "Gemini 3.1 Pro System Prompt"
        provider: google
        doc_type: system_prompt

  - model:
      model_id: "x-ai/grok-4.20-beta"
      provider: xai
      display_name: "Grok 4.2"
    documents:
      - doc_id: grok_system_prompt
        name: "Grok 4.2 System Prompt"
        provider: xai
        doc_type: system_prompt

experiment:
  name: iterative_edit_capable_test
  description: "Smoke test for the capable-model baseline: 3 rounds per chain. Verifies model IDs route correctly and edits are well-formed before launching the full 20-round run."
  n_rounds: 3
  temperature: 0.7
  conditions:
    - condition_id: baseline
      condition_name: Baseline

openrouter:
  disable_compression: true
  allow_fallbacks: false
  provider_order:
    anthropic: ["anthropic"]
    openai: ["openai"]
    google: ["google-ai-studio", "google-vertex"]

assignments:
  - model:
      model_id: "anthropic/claude-sonnet-4.6"
      provider: anthropic
      display_name: "Claude Sonnet 4.6"
    documents:
      - doc_id: claude_constitution
        name: "Claude's Constitution"
        provider: anthropic
        doc_type: constitution
      - doc_id: opus_system_prompt
        name: "Claude Opus 4.6 System Prompt"
        provider: anthropic
        doc_type: system_prompt

  - model:
      model_id: "openai/gpt-5.4"
      provider: openai
      display_name: "GPT-5.4"
    documents:
      - doc_id: openai_model_spec
        name: "OpenAI Model Spec"
        provider: openai
        doc_type: constitution
      - doc_id: gpt_system_prompt
        name: "GPT-5.4 System Prompt"
        provider: openai
        doc_type: system_prompt

  - model:
      model_id: "google/gemini-3.1-pro-preview"
      provider: google
      display_name: "Gemini 3.1 Pro"
    documents:
      - doc_id: gemini_constitution
        name: "Gemini App Approach"
        provider: google
        doc_type: constitution
      - doc_id: gemini_system_prompt
        name: "Gemini 3.1 Pro System Prompt"
        provider: google
        doc_type: system_prompt
